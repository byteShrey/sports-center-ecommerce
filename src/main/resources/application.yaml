server:
  port: 8081

spring:
  application:
    name: sports-center
  datasource:
    url: jdbc:mysql://localhost:3306/sports_center?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  jwt:
    secret: sports-center-dev-secret-key-change-me-to-a-long-random-value
    expiration-ms: 18000000
  auth:
    username: shopper
    password: Password123
